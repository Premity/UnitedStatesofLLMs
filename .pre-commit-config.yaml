# Runs on every commit so CI is never the first place you learn something broke.
#
#   make hooks     install these
#   git commit --no-verify    skip them (use sparingly)
#
# MERGE COMMITS: two hooks below necessarily fire on a merge — `no-commit-to-branch`
# (you are on develop or main by definition when merging into them) and
# `conventional-pre-commit` (git's "Merge branch 'x' into y" is deliberately not a
# Conventional Commit). pre-commit offers no per-hook merge exemption, so use
# `make merge-develop` / `make merge-main`, which pass --no-verify on the merge
# commit alone. Everything being merged has already passed these hooks
# individually, so nothing is skipped that was not already checked.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
        # Corpus documents and run artifacts belong in data/, which is gitignored.
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "develop"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]
