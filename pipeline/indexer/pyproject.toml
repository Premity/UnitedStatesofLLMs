# Offline indexer. Chunks the corpus at citation granularity (treaty article,
# judgment paragraph), embeds with BGE-M3 via fastembed, and upserts to Qdrant.
# Also emits the citation resolution index the validator reads at runtime.

[project]
name = "council-indexer"
version = "0.1.0"
description = "Chunks, embeds, and indexes the IHL corpus into Qdrant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "council-core",
    "fastembed>=0.4.2",
    "qdrant-client>=1.12",
]

[tool.uv.sources]
council-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
