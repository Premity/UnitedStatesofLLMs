<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Scales and laurel, from src/img/favicon.png.

         Two crops, not one scaled image: the laurel ring collapses into a
         smudge at 16px and robs the scales of the contrast they need, so the
         small icon is the scales alone and the full emblem appears from 32px
         up. Generated by scripts/build_favicons.py -- re-run it if the
         source art changes.

         Flattened onto Oak's --court-bg rather than left transparent. A
         favicon cannot follow the theme, and dark-blue art on transparency
         disappears against dark browser chrome. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>United States of LLMs — The Council</title>
    <meta
      name="description"
      content="Adversarial multi-agent debate for international humanitarian law analysis."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
