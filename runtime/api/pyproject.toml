# The orchestrator service. Runs the LangGraph debate, serves SSE turn events,
# and exposes run artifacts. Roles are modules here, not separate containers.

[project]
name = "council-api"
version = "0.1.0"
description = "Council orchestrator API — LangGraph debate, SSE streaming, run artifacts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "council-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2.45",
    "qdrant-client>=1.12",
    "fastembed>=0.4.2",
    "sse-starlette>=2.1",
    "httpx>=0.27",
]

[tool.uv.sources]
council-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
