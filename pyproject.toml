# ── United States of LLMs — root workspace ────────────────────────────────────
# A uv workspace. The root package holds no code of its own; it pins the shared
# toolchain and hosts the members below, so a single `uv sync` produces one
# virtualenv and one lockfile for the whole repository.

[project]
name = "council"
version = "0.1.0"
description = "Adversarial multi-agent debate for international humanitarian law analysis"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }

# The root pulls in every workspace member so `uv sync` produces one venv that
# can run the API, the pipeline, and the evaluation harness — and so pytest can
# import across them without per-package installs.
dependencies = [
    "council-core",
    "council-api",
    "council-fetcher",
    "council-indexer",
    "council-eval",
]

[project.optional-dependencies]
dev = [
    "ruff==0.14.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "respx>=0.21",
]

[tool.uv.workspace]
members = [
    "packages/council-core",
    "runtime/api",
    "pipeline/fetcher",
    "pipeline/indexer",
    "evaluation",
]

[tool.uv.sources]
council-core = { workspace = true }
council-api = { workspace = true }
council-fetcher = { workspace = true }
council-indexer = { workspace = true }
council-eval = { workspace = true }

# ── Ruff ──────────────────────────────────────────────────────────────────────
# Linter and formatter in one tool (replaces flake8 + isort + black).
# Run `make lint` to check, `make fmt` to auto-fix and format.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "corpus", "runtime/frontend"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes — undefined names, unused imports
    "I",     # isort — import ordering
    "UP",    # pyupgrade — modernise syntax for the target version
    "B",     # flake8-bugbear — likely bugs (mutable defaults, etc.)
    "SIM",   # flake8-simplify — readability
    "C4",    # flake8-comprehensions
    "ASYNC", # flake8-async — blocking calls inside async functions
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line length — the formatter handles this
    "B008",  # function call in default arg — required by FastAPI's Depends()
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]      # asserts are the point of a test
"**/__init__.py" = ["F401"]   # re-exports are intentional
"docs/diagrams/*" = ["RUF001"] # en dashes and × are deliberate in figure labels

[tool.ruff.lint.isort]
known-first-party = ["council_core", "app", "harness", "metrics"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["runtime/api/tests", "packages/council-core/tests", "evaluation/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: tests that take more than a second",
    "live: tests that call a real model backend (excluded from CI)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
