<rect x="240" y="366" width="230" height="56" rx="3" fill="#eef2f7" stroke="#5b7fa6" stroke-width="0.9"/>
<text x="250" y="387.0" text-anchor="start" font-size="11" fill="#1a1a1a">arguments</text>
<text x="250" y="401.0" text-anchor="start" font-size="11" fill="#1a1a1a">retrieved passages</text>
<rect x="480" y="366" width="250" height="56" rx="3" fill="#e8f0e8" stroke="#5f8560" stroke-width="0.9"/>
<text x="490" y="387.0" text-anchor="start" font-size="11" fill="#1a1a1a">attack the factual predicate:</text>
<text x="490" y="401.0" text-anchor="start" font-size="11" fill="#1a1a1a">sufficiency, mens rea, attribution</text>
<rect x="740" y="366" width="200" height="56" rx="3" fill="#f4eee6" stroke="#a3835a" stroke-width="0.9"/>
<text x="750" y="387.0" text-anchor="start" font-size="11" fill="#1a1a1a">Objection[]</text>
<text x="750" y="401.0" text-anchor="start" font-size="11" fill="#1a1a1a">raised_by = evidentiary</text>
<text x="956" y="387.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">Runs concurrently; writes only</text>
<text x="956" y="401.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">append-only channels</text>
<line x1="40" y1="432" x2="1160" y2="432" stroke="#dcdcdc" stroke-width="0.8"/>
<rect x="40" y="432" width="1120" height="76" fill="#f7f8fa"/>
<text x="50" y="460" text-anchor="start" font-size="13" fill="#1a1a1a" font-weight="700">Citation resolver</text>
<text x="50" y="477" text-anchor="start" font-size="10.5" fill="#6b6b6b" font-family="Consolas, 'DejaVu Sans Mono', monospace">council-core</text>
<rect x="240" y="442" width="230" height="56" rx="3" fill="#eef2f7" stroke="#5b7fa6" stroke-width="0.9"/>
<text x="250" y="463.0" text-anchor="start" font-size="11" fill="#1a1a1a">Citation[] from a role</text>
<text x="250" y="477.0" text-anchor="start" font-size="11" fill="#1a1a1a">citation index</text>
<rect x="480" y="442" width="250" height="56" rx="3" fill="#e8f0e8" stroke="#5f8560" stroke-width="0.9"/>
