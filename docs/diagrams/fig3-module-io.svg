<text x="50" y="232" text-anchor="start" font-size="13" fill="#1a1a1a" font-weight="700">Presenter</text>
<text x="50" y="249" text-anchor="start" font-size="10.5" fill="#6b6b6b" font-family="Consolas, 'DejaVu Sans Mono', monospace">roles/presenter</text>
<rect x="240" y="214" width="230" height="56" rx="3" fill="#eef2f7" stroke="#5b7fa6" stroke-width="0.9"/>
<text x="250" y="228.0" text-anchor="start" font-size="11" fill="#1a1a1a">question + facts</text>
<text x="250" y="242.0" text-anchor="start" font-size="11" fill="#1a1a1a">retrieved passages</text>
<text x="250" y="256.0" text-anchor="start" font-size="11" fill="#1a1a1a">prior objections</text>
