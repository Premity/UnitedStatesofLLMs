<text x="750" y="173.0" text-anchor="start" font-size="11" fill="#1a1a1a">each with a locator</text>
<text x="956" y="159.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">Query embedding model must match</text>
<text x="956" y="173.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">the indexer's</text>
