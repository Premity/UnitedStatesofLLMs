<text x="490" y="249.0" text-anchor="start" font-size="11" fill="#1a1a1a">rebut in later rounds</text>
<rect x="740" y="214" width="200" height="56" rx="3" fill="#f4eee6" stroke="#a3835a" stroke-width="0.9"/>
