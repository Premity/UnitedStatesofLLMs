<rect x="480" y="518" width="250" height="56" rx="3" fill="#e8f0e8" stroke="#5f8560" stroke-width="0.9"/>
<text x="490" y="539.0" text-anchor="start" font-size="11" fill="#1a1a1a">rule on every objection</text>
<text x="490" y="553.0" text-anchor="start" font-size="11" fill="#1a1a1a">price residual uncertainty</text>
<rect x="740" y="518" width="200" height="56" rx="3" fill="#f4eee6" stroke="#a3835a" stroke-width="0.9"/>
<text x="750" y="539.0" text-anchor="start" font-size="11" fill="#1a1a1a">Verdict</text>
<text x="750" y="553.0" text-anchor="start" font-size="11" fill="#1a1a1a">confidence ∈ [0,1]</text>
<text x="956" y="539.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">Must rule on every objection —</text>
<text x="956" y="553.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">silence is not a ruling</text>
<line x1="40" y1="584" x2="1160" y2="584" stroke="#dcdcdc" stroke-width="0.8"/>
<rect x="40" y="584" width="1120" height="76" fill="#f7f8fa"/>
<text x="50" y="612" text-anchor="start" font-size="13" fill="#1a1a1a" font-weight="700">Orchestrator</text>
<text x="50" y="629" text-anchor="start" font-size="10.5" fill="#6b6b6b" font-family="Consolas, 'DejaVu Sans Mono', monospace">graph/workflow</text>
<rect x="240" y="594" width="230" height="56" rx="3" fill="#eef2f7" stroke="#5b7fa6" stroke-width="0.9"/>
<text x="250" y="615.0" text-anchor="start" font-size="11" fill="#1a1a1a">DebateConfig</text>
<text x="250" y="629.0" text-anchor="start" font-size="11" fill="#1a1a1a">GraphState</text>
<rect x="480" y="594" width="250" height="56" rx="3" fill="#e8f0e8" stroke="#5f8560" stroke-width="0.9"/>
<text x="490" y="615.0" text-anchor="start" font-size="11" fill="#1a1a1a">sequence roles</text>
<text x="490" y="629.0" text-anchor="start" font-size="11" fill="#1a1a1a">apply termination rules</text>
<rect x="740" y="594" width="200" height="56" rx="3" fill="#f4eee6" stroke="#a3835a" stroke-width="0.9"/>
<text x="750" y="615.0" text-anchor="start" font-size="11" fill="#1a1a1a">completed debate</text>
<text x="750" y="629.0" text-anchor="start" font-size="11" fill="#1a1a1a">turn stream</text>
<text x="956" y="615.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">max_rounds is an absolute ceiling</text>
<text x="956" y="629.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">in every mode</text>
<line x1="40" y1="660" x2="1160" y2="660" stroke="#dcdcdc" stroke-width="0.8"/>
<text x="50" y="688" text-anchor="start" font-size="13" fill="#1a1a1a" font-weight="700">Exporter</text>
<text x="50" y="705" text-anchor="start" font-size="10.5" fill="#6b6b6b" font-family="Consolas, 'DejaVu Sans Mono', monospace">council-core</text>
<rect x="240" y="670" width="230" height="56" rx="3" fill="#eef2f7" stroke="#5b7fa6" stroke-width="0.9"/>
<text x="250" y="698.0" text-anchor="start" font-size="11" fill="#1a1a1a">completed run artifact</text>
<rect x="480" y="670" width="250" height="56" rx="3" fill="#e8f0e8" stroke="#5f8560" stroke-width="0.9"/>
<text x="490" y="691.0" text-anchor="start" font-size="11" fill="#1a1a1a">render dissent log</text>
<text x="490" y="705.0" text-anchor="start" font-size="11" fill="#1a1a1a">resolve citations for display</text>
<rect x="740" y="670" width="200" height="56" rx="3" fill="#f4eee6" stroke="#a3835a" stroke-width="0.9"/>
<text x="750" y="691.0" text-anchor="start" font-size="11" fill="#1a1a1a">reviewable document</text>
<text x="750" y="705.0" text-anchor="start" font-size="11" fill="#1a1a1a">Markdown / JSON</text>
<text x="956" y="691.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">Overruled objections are the</text>
<text x="956" y="705.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">deliverable, not an appendix</text>
<line x1="40" y1="736" x2="1160" y2="736" stroke="#dcdcdc" stroke-width="0.8"/>
<text x="40" y="764" text-anchor="start" font-size="11" fill="#6b6b6b" font-style="italic">The two attackers share one implementation class, differing only by prompt template and model, so disabling one changes nothing about the other.</text>
<text x="40" y="782" text-anchor="start" font-size="11" fill="#6b6b6b" font-style="italic">raised_by is overwritten with the true role after parsing, so a model cannot attribute objections to its counterpart and distort the independence metric.</text>
<text x="40" y="800" text-anchor="start" font-size="11" fill="#6b6b6b" font-style="italic">Every module's output is validated against a schema before the next module sees it; a parse failure is retried once with the validation error attached.</text>
</svg>
