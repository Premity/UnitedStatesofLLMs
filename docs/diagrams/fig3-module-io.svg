<text x="490" y="159.0" text-anchor="start" font-size="11" fill="#1a1a1a">embed query (BGE-M3, ONNX)</text>
<text x="490" y="173.0" text-anchor="start" font-size="11" fill="#1a1a1a">cosine search over ihl_corpus</text>
