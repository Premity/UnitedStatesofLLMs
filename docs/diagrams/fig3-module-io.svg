<text x="600.0" y="34" text-anchor="middle" font-size="17" fill="#1a1a1a" font-weight="700">Figure 3 — Module Input, Processing and Output</text>
<text x="600.0" y="53" text-anchor="middle" font-size="12" fill="#6b6b6b">Each row is one module; the final column is the contract it must not break</text>
