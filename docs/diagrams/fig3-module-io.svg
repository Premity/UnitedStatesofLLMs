<rect x="740" y="442" width="200" height="56" rx="3" fill="#f4eee6" stroke="#a3835a" stroke-width="0.9"/>
<text x="750" y="463.0" text-anchor="start" font-size="11" fill="#1a1a1a">ResolvedCitation[]</text>
<text x="750" y="477.0" text-anchor="start" font-size="11" fill="#1a1a1a">one of four statuses</text>
<text x="956" y="456.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">unresolved ≠ out_of_corpus —</text>
<text x="956" y="470.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">merging them voids the fabrication</text>
<text x="956" y="484.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">metric</text>
<line x1="40" y1="508" x2="1160" y2="508" stroke="#dcdcdc" stroke-width="0.8"/>
<text x="50" y="536" text-anchor="start" font-size="13" fill="#1a1a1a" font-weight="700">Judge</text>
<text x="50" y="553" text-anchor="start" font-size="10.5" fill="#6b6b6b" font-family="Consolas, 'DejaVu Sans Mono', monospace">roles/judge</text>
