<text x="50" y="308" text-anchor="start" font-size="13" fill="#1a1a1a" font-weight="700">Doctrinal attacker</text>
<text x="50" y="325" text-anchor="start" font-size="10.5" fill="#6b6b6b" font-family="Consolas, 'DejaVu Sans Mono', monospace">roles/attacker</text>
<rect x="240" y="290" width="230" height="56" rx="3" fill="#eef2f7" stroke="#5b7fa6" stroke-width="0.9"/>
<text x="250" y="311.0" text-anchor="start" font-size="11" fill="#1a1a1a">arguments</text>
<text x="250" y="325.0" text-anchor="start" font-size="11" fill="#1a1a1a">retrieved passages</text>
<rect x="480" y="290" width="250" height="56" rx="3" fill="#e8f0e8" stroke="#5f8560" stroke-width="0.9"/>
<text x="490" y="311.0" text-anchor="start" font-size="11" fill="#1a1a1a">attack legal characterisation:</text>
<text x="490" y="325.0" text-anchor="start" font-size="11" fill="#1a1a1a">tests, elements, interpretation</text>
<rect x="740" y="290" width="200" height="56" rx="3" fill="#f4eee6" stroke="#a3835a" stroke-width="0.9"/>
<text x="750" y="311.0" text-anchor="start" font-size="11" fill="#1a1a1a">Objection[]</text>
<text x="750" y="325.0" text-anchor="start" font-size="11" fill="#1a1a1a">raised_by = doctrinal</text>
<text x="956" y="311.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">Must leave factual sufficiency to</text>
<text x="956" y="325.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">its counterpart</text>
