<text x="750" y="249.0" text-anchor="start" font-size="11" fill="#1a1a1a">each with Citation[]</text>
<text x="956" y="228.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">Sets the quality ceiling —</text>
<text x="956" y="242.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">attackers can only test the case</text>
<text x="956" y="256.0" text-anchor="start" font-size="10.5" fill="#6b6b6b">given</text>
