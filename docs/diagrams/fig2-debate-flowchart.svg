<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1080"
     viewBox="0 0 1180 1080" font-family="Calibri, Carlito, 'Segoe UI', sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/>
  </marker>
  <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5"
          markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
  </marker>
</defs>
<rect width="1180" height="1080" fill="#ffffff"/>
<text x="590.0" y="34" text-anchor="middle" font-size="17" fill="#1a1a1a" font-weight="700">Debate Workflow</text>
<text x="590.0" y="53" text-anchor="middle" font-size="12" fill="#6b6b6b">From question to dissent log, with termination guarantees</text>
<rect x="40" y="74" width="1100" height="98" rx="6" fill="#f0eef4" fill-opacity="0.45" stroke="#7b6f99" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="52" y="92" font-size="11.5" font-weight="700" fill="#7b6f99" letter-spacing="0.8">PREREQUISITE  ·  offline, run once per corpus version</text>
<rect x="66" y="100" width="130" height="50" rx="25.0" fill="#f0eef4" stroke="#7b6f99" stroke-width="1.2"/>
<text x="131.0" y="129.5" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">Start</text>
<rect x="226" y="100" width="150" height="50" rx="4" fill="#f0eef4" stroke="#7b6f99" stroke-width="1.2"/>
<text x="301.0" y="123.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">Read manifests</text>
<text x="301.0" y="138.0" text-anchor="middle" font-size="11" fill="#6b6b6b">scope is fixed</text>
<rect x="406" y="100" width="170" height="50" rx="4" fill="#f0eef4" stroke="#7b6f99" stroke-width="1.2"/>
<text x="491.0" y="123.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">Fetch documents</text>
<text x="491.0" y="138.0" text-anchor="middle" font-size="11" fill="#6b6b6b">treaties · cases · resolutions</text>
<rect x="606" y="100" width="200" height="50" rx="4" fill="#f0eef4" stroke="#7b6f99" stroke-width="1.2"/>
<text x="706.0" y="122.75" text-anchor="middle" font-size="11.5" fill="#1a1a1a" font-weight="600">Chunk at citation granularity</text>
<text x="706.0" y="137.25" text-anchor="middle" font-size="11" fill="#6b6b6b">article · paragraph</text>
<rect x="836" y="100" width="190" height="50" rx="4" fill="#f0eef4" stroke="#7b6f99" stroke-width="1.2"/>
<text x="931.0" y="123.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">Embed + upsert</text>
<text x="931.0" y="138.0" text-anchor="middle" font-size="11" fill="#6b6b6b">Qdrant + citation index</text>
<line x1="196" y1="125" x2="224" y2="125" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="376" y1="125" x2="404" y2="125" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="576" y1="125" x2="604" y2="125" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="806" y1="125" x2="834" y2="125" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="275" y="196" width="170" height="46" rx="23.0" fill="#e4ecf4" stroke="#5b7fa6" stroke-width="1.2"/>
<text x="360.0" y="223.75" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">Question + facts</text>
<line x1="360" y1="242" x2="360" y2="268" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="250" y="268" width="220" height="52" rx="4" fill="#e8f0e8" stroke="#5f8560" stroke-width="1.2"/>
<text x="360.0" y="292.25" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">Retrieve context</text>
<text x="360.0" y="307.75" text-anchor="middle" font-size="11" fill="#6b6b6b">top-k passages from Qdrant</text>
<line x1="360" y1="320" x2="360" y2="346" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="250" y="346" width="220" height="52" rx="4" fill="#e8f0e8" stroke="#5f8560" stroke-width="1.2"/>
<text x="360.0" y="370.25" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">Presenter builds case</text>
<text x="360.0" y="385.75" text-anchor="middle" font-size="11" fill="#6b6b6b">discrete, contestable arguments</text>
<line x1="360" y1="398" x2="360" y2="424" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="360" y="418" text-anchor="start" font-size="10" fill="#1a1a1a"></text>
<rect x="120" y="424" width="205" height="56" rx="4" fill="#e8f0e8" stroke="#5f8560" stroke-width="1.2"/>
<text x="222.5" y="443.75" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">Doctrinal attacker</text>
<text x="222.5" y="459.25" text-anchor="middle" font-size="11" fill="#6b6b6b">legal characterisation:</text>
<text x="222.5" y="472.25" text-anchor="middle" font-size="11" fill="#6b6b6b">tests, elements, interpretation</text>
<rect x="395" y="424" width="205" height="56" rx="4" fill="#e8f0e8" stroke="#5f8560" stroke-width="1.2"/>
<text x="497.5" y="443.75" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">Evidentiary attacker</text>
<text x="497.5" y="459.25" text-anchor="middle" font-size="11" fill="#6b6b6b">factual predicate:</text>
<text x="497.5" y="472.25" text-anchor="middle" font-size="11" fill="#6b6b6b">sufficiency, mens rea, attribution</text>
<polyline points="360,424 360,410 223,410 223,422" fill="none" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="360,424 360,410 497,410 497,422" fill="none" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="612" y="452" text-anchor="start" font-size="10.5" fill="#6b6b6b">run concurrently</text>
<text x="612" y="466" text-anchor="start" font-size="10.5" fill="#6b6b6b">independent mandates</text>
<polyline points="223,480 223,498 360,498 360,516" fill="none" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<polyline points="497,480 497,498 360,498" fill="none" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="235" y="516" width="250" height="52" rx="4" fill="#f4eee6" stroke="#a3835a" stroke-width="1.2"/>
<text x="360.0" y="540.25" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">Resolve every citation</text>
<text x="360.0" y="555.75" text-anchor="middle" font-size="11" fill="#6b6b6b">against the corpus index</text>
<polyline points="485,542 700,542" fill="none" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="700" y="500" width="420" height="86" rx="4" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
<text x="910.0" y="548.0" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="600"></text>
<text x="716" y="522" text-anchor="start" font-size="11.5" fill="#1a1a1a" font-weight="700">Citation status — attached to the claim, not reported later</text>
<text x="716" y="540" text-anchor="start" font-size="10.5" fill="#1a1a1a" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">resolved</text>
<text x="812" y="540" text-anchor="start" font-size="10.5" fill="#6b6b6b">— locator found, quote matches</text>
<text x="716" y="553" text-anchor="start" font-size="10.5" fill="#1a1a1a" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">misquoted</text>
<text x="812" y="553" text-anchor="start" font-size="10.5" fill="#6b6b6b">— locator found, quote diverges</text>
<text x="716" y="566" text-anchor="start" font-size="10.5" fill="#1a1a1a" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">unresolved</text>
<text x="812" y="566" text-anchor="start" font-size="10.5" fill="#6b6b6b">— no such locator → fabrication signal</text>
<text x="716" y="579" text-anchor="start" font-size="10.5" fill="#1a1a1a" font-weight="700" font-family="Consolas, 'DejaVu Sans Mono', monospace">out_of_corpus</text>
<text x="812" y="579" text-anchor="start" font-size="10.5" fill="#6b6b6b">— real authority, not indexed</text>
<line x1="360" y1="568" x2="360" y2="594" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="235" y="594" width="250" height="56" rx="4" fill="#e8f0e8" stroke="#5f8560" stroke-width="1.2"/>
<text x="360.0" y="613.75" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">Judge rules</text>
<text x="360.0" y="629.25" text-anchor="middle" font-size="11" fill="#6b6b6b">sustains or overrules each objection,</text>
<text x="360.0" y="642.25" text-anchor="middle" font-size="11" fill="#6b6b6b">with a stated reason</text>
<line x1="360" y1="650" x2="360" y2="678" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<polygon points="360,678.0 485.0,716 360,754.0 235.0,716" fill="#e4ecf4" stroke="#5b7fa6" stroke-width="1.2"/>
<text x="360" y="714.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">Novel objections</text>
<text x="360" y="728.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">raised this round?</text>
<line x1="485" y1="716" x2="700" y2="716" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="592.5" y="710.0" text-anchor="middle" font-size="10.5" fill="#6b6b6b">no</text>
<polyline points="360,754 360,788" fill="none" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="376" y="775" text-anchor="start" font-size="10.5" fill="#6b6b6b">yes</text>
<polygon points="360,788.0 485.0,826 360,864.0 235.0,826" fill="#e4ecf4" stroke="#5b7fa6" stroke-width="1.2"/>
<text x="360" y="831.0" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="600">round &lt; max_rounds?</text>
<line x1="485" y1="826" x2="700" y2="826" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="592.5" y="820.0" text-anchor="middle" font-size="10.5" fill="#6b6b6b">no  ·  hard ceiling</text>
<polyline points="235,826 62,826 62,372 248,372" fill="none" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#ad)"/>
<text x="74" y="356" text-anchor="start" font-size="10.5" fill="#6b6b6b">yes — next round</text>
<text x="74" y="700" text-anchor="start" font-size="10.5" fill="#6b6b6b">presenter rebuts</text>
<rect x="700" y="688" width="420" height="56" rx="4" fill="#e4ecf4" stroke="#5b7fa6" stroke-width="1.2"/>
<text x="910.0" y="714.25" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">Emit verdict</text>
<text x="910.0" y="729.75" text-anchor="middle" font-size="11" fill="#6b6b6b">conclusion · calibrated confidence · reasoning</text>
<rect x="700" y="790" width="420" height="56" rx="4" fill="#f4eee6" stroke="#a3835a" stroke-width="1.2"/>
<text x="910.0" y="816.25" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">Publish dissent log</text>
<text x="910.0" y="831.75" text-anchor="middle" font-size="11" fill="#6b6b6b">every overruled objection + the judge's reason</text>
<line x1="910" y1="744" x2="910" y2="788" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="700" y="876" width="420" height="50" rx="4" fill="#e8f0e8" stroke="#5f8560" stroke-width="1.2"/>
<text x="910.0" y="899.25" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">Persist run artifact</text>
<text x="910.0" y="914.75" text-anchor="middle" font-size="11" fill="#6b6b6b">prompts, model ids, seeds, citations — written even on failure</text>
<line x1="910" y1="846" x2="910" y2="874" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="825" y="956" width="170" height="46" rx="23.0" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.2"/>
<text x="910.0" y="983.75" text-anchor="middle" font-size="12.5" fill="#1a1a1a" font-weight="600">End</text>
<line x1="910" y1="926" x2="910" y2="954" stroke="#9a9a9a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="40" y="1004" text-anchor="start" font-size="11" fill="#6b6b6b" font-style="italic">The debate halts on whichever condition fires first. The round ceiling is absolute: it applies in fixed and auto modes alike, so no configuration can produce an unbounded loop.</text>
<text x="40" y="1022" text-anchor="start" font-size="11" fill="#6b6b6b" font-style="italic">Citations are resolved before the judge reads an argument, so a fabricated authority cannot influence the ruling — the gap this design closes.</text>
<text x="40" y="1040" text-anchor="start" font-size="11" fill="#6b6b6b" font-style="italic">The dissent log, not the conclusion, is the primary output.</text>
</svg>
