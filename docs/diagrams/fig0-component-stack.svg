<text x="150" y="962" text-anchor="start" font-size="11" fill="#6b6b6b" font-style="italic">Every tier depends only on the tier beneath it. council-core imports nothing from the services above it, so the domain model is testable without Qdrant or a model call.</text>
<text x="150" y="980" text-anchor="start" font-size="11" fill="#6b6b6b" font-style="italic">The pipeline is drawn apart because it never runs during a request — it populates the infrastructure tier ahead of time.</text>
