<text x="60" y="694" text-anchor="start" font-size="10.5" fill="#6b6b6b">LiteLLM gateway  ·  one call path for every role</text>
<text x="86" y="844" text-anchor="start" font-size="11" fill="#6b6b6b" font-style="italic">The citation resolver sits on the role boundary, so arguments reach the judge already marked grounded or unsupported.</text>
<text x="86" y="862" text-anchor="start" font-size="11" fill="#6b6b6b" font-style="italic">Both attackers execute concurrently and write to append-only state channels; every other channel has exactly one writer.</text>
<text x="86" y="880" text-anchor="start" font-size="11" fill="#6b6b6b" font-style="italic">The pipeline runs offline and populates the stores the runtime reads. It is never on the request path.</text>
